#:schema https://raw.githubusercontent.com/antimemes/memelint/main/crates/memelint/memelint.schema.json
# memelint configuration. See README.md.

# Technical names and verbs in the comments and documents of this
# repository. A word goes here when it is a technical name in this domain,
# and not when it is only easier English.
words = [
  # this project
  "memelint", "memelint-common", "memelint-import", "allowlist", "checker",
  "importer", "finding", "fix", "vocabulary", "rule", "worktree",
  "overlay",
  # programs and files
  "acronym", "cargo", "comment",
  "docstring",
  "font", "glyph",
  "line", "loader", "lookup", "matrix",
  "pdf", "subcommand",
  "text",
  # tools and projects
  "nix", "nixpkgs", "neovim", "helix", "tree-sitter", "abi", "xdg", "serde",
  "clap", "acrolinx", "congree", "hyperste",
  # language and the spec
  "adjective", "adverb", "article", "conjunction", "contraction",
  "dictionary", "english", "headword", "imperative", "infinitive",
  "inflection", "lemma", "meaning", "noun", "paragraph", "participle",
  "part-of-speech", "phrase", "plural", "possessive", "prefix", "preposition",
  "pronoun", "prose", "sentence", "speech", "stem", "suffix", "tense", "verb",
  "word",
  # more names from the code and the spec
  "unapproved", "technical", "spec", "issue", "summary",
  "footer", "cell", "qualifier", "project", "document", "section",
  "vendor", "marker", "baseline", "character", "body", "status", "pos", "adj",
  "adv", "prep", "conj", "id", "geometry", "indentation", "x-coordinate",
  "upper-case", "lower-case", "mixed-case", "inflected", "descriptive",
  "procedural", "checkable", "heuristic", "judgment", "feasibility",
  "tally", "paraphrase", "field", "signature",
  # verbs and nouns of programs, in their technical sense
  "extract", "feature",
  "join", "language", "load", "note",
  "padding", "page", "print", "program",
  "run", "sort", "split", "static", "state", "trailing", "unload",
  "wrap", "case", "end-to-end",
  "machine",
  # more technical nouns
  "form", "letter", "simplified", "shared", "checkability", "parenthesis",
  "scale", "geometric", "mean", "context", "message",
  "multi-word", "parentheses", "layout", "size", "hyphen",
  # names of parts of the language, and the section names of the spec
  "writing", "practice", "punctuation", "semicolon", "colon", "hyphenate",
  "abbreviation", "title", "quote", "proper", "demonstrative", "singular",
  "participle", "passive", "modal", "clause", "phrasal", "terminology",
  "style", "topic", "category", "synonym", "slang", "jargon", "regional",
  "spelling", "american", "british", "simple", "present", "past", "future",
  "perfect", "progressive", "construction", "auxiliary", "agent", "heading",
  "target", "fragment", "substitution", "organisation",
  "tagger", "cue", "clarity", "label",
  "caution", "action", "consistent", "consistency", "particle",
  # more words from the README
  "domain", "root", "development", "workspace", "crate",
  "commercial", "complex", "rust", "python", "java", "javascript",
  "typescript", "quotation", "apostrophe", "usage", "wrapper",
  "derivation", "flake", "tarball", "glob", "software",
  "severity", "strict", "profile", "documentation", "editor", "curl", "sh", "linux", "macos",
  "direnv", "meme",
]

# The fixture worktrees have prose that does not follow the rules, as a test.
ignore = ["crates/memelint/tests/worktrees/", "crates/memelint/tests/cases/*/fixed/"]

# The README and the documentation use one verb that is not approved. It is
# in them for its meaning, and only there.
[languages.markdown]
# The documentation of this project is written in STE.
check = true
words = ["spread"]
